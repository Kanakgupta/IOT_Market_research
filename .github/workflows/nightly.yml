# Optional: run the agent in the cloud every night and publish the site to GitHub Pages.
# Push this folder to a GitHub repo, enable Pages (Settings > Pages > Source: GitHub Actions).
# 09:17 UTC = 1:17 AM PST / 2:17 AM PDT. GitHub can delay scheduled runs.
name: nightly-wireless-research
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "agent/**"
      - ".github/workflows/nightly.yml"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: nightly-research, cancel-in-progress: false }
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with: { python-version: "3.12" }
      - if: github.event_name != 'push'
        run: pip install requests
      - name: Run research agent
        if: github.event_name != 'push'
        working-directory: agent
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}      # optional
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}    # optional
          LLM_MODEL: ${{ secrets.LLM_MODEL }}          # optional
        run: python research_agent.py
      - name: Persist rolling 30-day state
        if: github.event_name != 'push'
        run: |
          git config user.name "research-agent"
          git config user.email "research-agent@users.noreply.github.com"
          git add agent/state/*.json site/data
          if ! git diff --cached --quiet; then
            git commit -m "nightly research $(date -u +%F)" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: research
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
